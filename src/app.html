<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Icon set. The raster files are generated from the vectors by
         `npm run icons` — never edit the PNG/ICO by hand. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenStrata — modern operations for strata and condominium communities." />
    <meta name="theme-color" content="#102d3b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenStrata" />
    <meta property="og:title" content="OpenStrata — Community operations, beautifully organized" />
    <meta property="og:description" content="The modern operating system for strata and condominium communities. Fiat rails today, Bitcoin sovereignty when you’re ready." />
    <meta property="og:url" content="https://openstrata.giveabit.io/" />
    <meta property="og:image" content="https://openstrata.giveabit.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenStrata — the brush-drawn strata mark on the brand navy" />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OpenStrata — Community operations, beautifully organized" />
    <meta name="twitter:description" content="The modern operating system for strata and condominium communities." />
    <meta name="twitter:image" content="https://openstrata.giveabit.io/og.png" />
    <link rel="canonical" href="https://openstrata.giveabit.io/" />
    <link rel="alternate" hreflang="en" href="https://openstrata.giveabit.io/" />
    <link rel="alternate" hreflang="x-default" href="https://openstrata.giveabit.io/" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('openstrata-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
      // First visit? Ask the one question before showing a dashboard full of
      // someone else's numbers. Same class-before-paint trick as the theme: the
      // rule lives in src/lib/start.ts and the two CSS rules that act on this
      // class are in src/app.css.
      try {
        if (!localStorage.getItem('openstrata-start') && !localStorage.getItem('openstrata-token')) {
          document.documentElement.classList.add('start-pending');
        }
      } catch (e) {}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"OpenStrata","url":"https://openstrata.giveabit.io","description":"Modern operations for strata and condominium communities.","publisher":{"@type":"Organization","name":"Give A Bit","url":"https://giveabit.io"}}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Umami analytics for openstrata.giveabit.io. -->
    <script defer src="https://analytics.giveabit.io/script.js" data-website-id="b918844c-2503-4dcd-bef2-66c103a0ee13"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
