<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OpenStrata">
  <!-- Small-size rendition of the brush mark. The full mark is very tall and
       thin (283x448), so at 16px its strokes fall below one device pixel and
       turn to mush. The favicon keeps the three strata layers that make the
       mark recognisable, drawn bold on the brand navy so it reads on both
       light and dark browser chrome. -->
