name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, audit, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      - name: i18n audit (keys + hard-coded copy scan)
        run: npm run audit:i18n

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify static assets exist
        run: |
          test -f build/index.html
          test -f build/manifest.webmanifest
          test -f build/sw.js
          test -f build/404.html
          test -f build/rss.xml
          test -f build/sitemap.xml

  backend:
    name: Phase 3 backend — typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck

      - name: Backend unit tests
        run: npm test

  backend-e2e:
    name: Phase 3 backend — Postgres e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openstrata
          POSTGRES_PASSWORD: openstrata-dev-only
          POSTGRES_DB: openstrata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openstrata -d openstrata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openstrata:openstrata-dev-only@localhost:5432/openstrata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Apply all migrations (0001..0006+)
        run: npm run migrate

      - name: Postgres e2e smoke suite (register -> ledger -> billing -> payments -> forms -> meetings)
        run: npm run test -- e2e-smoke
